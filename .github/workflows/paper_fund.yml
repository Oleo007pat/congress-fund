name: Paper fund (daily)

on:
  schedule:
    # Weekdays 12:45 UTC. US market opens 14:30 UTC in winter (EST, UTC-5) and 13:30 UTC in summer (EDT, UTC-4),
    # and market-on-open orders must be in before ~09:28 ET, i.e. 14:28 UTC (winter) / 13:28 UTC (summer).
    # 12:45 UTC is therefore 7:45 ET in winter and 8:45 ET in summer. GitHub may delay scheduled runs by
    # tens of minutes at busy times; a run that is too late is detected by the runner (Alpaca clock) and
    # postpones new orders to the next run instead of sending them.
    - cron: "45 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute everything, send NO orders, commit nothing"
        type: boolean
        default: false

# Never two runs at the same time (they would race on state.json and on the Alpaca account).
concurrency:
  group: paper-fund
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r live/requirements.txt

      - name: Run daily paper fund
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 -m live.run_daily --dry-run
          else
            python3 -m live.run_daily
          fi

      # Runs even if the previous step failed (house_unreachable, Alpaca error), so that the site shows the status.
      - name: Commit state, logs and site data
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "paper-fund-bot"
          git config user.email "actions@users.noreply.github.com"
          # -f: *.csv is ignored in .gitignore except the explicitly allowed live files. Cache (PDFs) is never added.
          for f in data/live/state.json data/live/history.csv data/live/trades_log.csv data/live/parsed_trades.csv docs/data/live.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingen ændringer at committe."
          else
            git commit -m "paper-fund-bot: daglig kørsel $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Upload dry-run output
        if: ${{ always() && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: |
            docs/data/live_dryrun.json
            data/live/dryrun/
          if-no-files-found: warn
