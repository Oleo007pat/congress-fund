name: Paper fund (daily)

on:
  schedule:
    # Alpaca accepts market-on-open (opg) orders only between 19:00 and 09:28 ET. GitHub often starts scheduled
    # runs hours late (observed: ~8 hours), so the runs are placed early in that window:
    #   03:17 UTC = 22:17 ET (winter) / 23:17 ET (summer) the evening before the session;
    #   05:17 UTC = 00:17 ET / 01:17 ET (backup).
    # Even 8 hours late, the backup lands at 08:17 ET (winter) / 09:17 ET (summer), still before 09:28 ET.
    # Mon-Fri UTC = the evenings before the Mon-Fri sessions. A run outside the window is detected by the runner
    # (Alpaca clock + ET time) and postpones new orders instead of sending them.
    - cron: "17 3 * * 1-5"
    # Backup trigger: a second run the same night is harmless (orders use idempotent client_order_ids,
    # history is upserted per date).
    - cron: "17 5 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute everything, send NO orders, commit nothing"
        type: boolean
        default: false

# Never two runs at the same time (they would race on state.json and on the Alpaca account).
concurrency:
  group: paper-fund
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r live/requirements.txt

      - name: Run daily paper fund
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 -m live.run_daily --dry-run
          else
            python3 -m live.run_daily
          fi

      # Runs even if the previous step failed (house_unreachable, Alpaca error), so that the site shows the status.
      - name: Commit state, logs and site data
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "paper-fund-bot"
          git config user.email "actions@users.noreply.github.com"
          # -f: *.csv is ignored in .gitignore except the explicitly allowed live files. Cache (PDFs) is never added.
          for f in data/live/state.json data/live/history.csv data/live/trades_log.csv data/live/parsed_trades.csv docs/data/live.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingen ændringer at committe."
          else
            git commit -m "paper-fund-bot: daglig kørsel $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Upload dry-run output
        if: ${{ always() && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: |
            docs/data/live_dryrun.json
            data/live/dryrun/
          if-no-files-found: warn
